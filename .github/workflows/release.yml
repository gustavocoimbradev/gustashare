name: Build and release GustaShare

# So dispara manualmente (aba Actions -> Run workflow). A versao so muda
# quando esse workflow roda de verdade — "npm run publish" so envia
# codigo, nao mexe em versao nem builda nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm run bump-version

      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Build app (Windows real, sem wine)
        run: npm run build

      - name: Copiar .exe pra update-server
        shell: bash
        run: cp release/GustaShare-Portable.exe update-server/GustaShare-Portable.exe

      - name: Atualizar latest.json
        run: node scripts/sync-update-server.js

      - name: Deploy update-server na Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # update-server/.vercel/project.json já linka essa pasta ao
        # projeto certo (orgId+projectId, sem segredo nenhum ali) — por
        # isso rodamos de dentro dela: a CLI já sabe que o CWD É o
        # diretório do projeto, sem precisar combinar com nenhum "Root
        # Directory" configurado no painel (o que causava o path
        # duplicado) nem fazer upload do repo inteiro (o que causava
        # estourar 100MB de novo com a pasta release/ junto).
        run: |
          cd update-server
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Commitar versão + latest.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json update-server/latest.json
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push
