name: Build and release GustaShare

# So dispara manualmente (aba Actions -> Run workflow). A versao so muda
# quando esse workflow roda de verdade — "npm run publish" so envia
# codigo, nao mexe em versao nem builda nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm run bump-version

      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Setup Rust (módulo nativo de captura)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build módulo nativo (native/gustashare-capture)
        run: npm run build-native

      - name: Build app (Windows real, sem wine)
        run: npm run build

      - name: Publicar instalador no GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v${version}"
          exe="release/GustaShare-Setup.exe"
          ls -lh "$exe"

          visibility="$(gh repo view --json isPrivate -q .isPrivate || echo unknown)"
          if [ "$visibility" = "true" ]; then
            echo "::warning::Repositório privado: o download público do .exe dá 404. Em Settings → General, deixe o repo público."
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" --clobber
          else
            gh release create "$tag" "$exe" \
              --title "GustaShare ${version}" \
              --notes "Instalador Windows do GustaShare ${version}." \
              --latest
          fi

      - name: Atualizar latest.json
        run: node scripts/sync-update-server.js

      - name: Build web (base absoluta, pra Vercel)
        run: npm run build:web

      - name: Deploy na Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Root Directory do painel tem que estar VAZIO (raiz do repo).
        # Publicamos só o site + latest.json. O .exe fica no GitHub Release
        # (Vercel Hobby recusa arquivo > 100MB).
        run: |
          ls -lh dist/latest.json
          rm -f dist/GustaShare-Setup.exe dist/GustaShare-Portable.exe
          staging="$(mktemp -d)"
          mkdir -p "$staging/.vercel"
          cp update-server/.vercel/project.json "$staging/.vercel/project.json"
          cp scripts/vercel-static.json "$staging/vercel.json"
          cp -r dist/. "$staging/"
          rm -f "$staging/GustaShare-Setup.exe" "$staging/GustaShare-Portable.exe"
          ls -lh "$staging"
          cd "$staging"
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Commitar versão + latest.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json update-server/latest.json vercel.json scripts/vercel-static.json update-server/vercel.json
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci] [skip vercel]"
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            git fetch origin "$branch"
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejeitado, tentando de novo ($i)..."
            sleep 4
          done
          echo "Não conseguiu enviar o commit de versão."
          exit 1
