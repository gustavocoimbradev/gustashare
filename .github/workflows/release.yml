name: Build and release GustaShare

# So dispara manualmente (aba Actions -> Run workflow). A versao so muda
# quando esse workflow roda de verdade — "npm run publish" so envia
# codigo, nao mexe em versao nem builda nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm run bump-version

      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Setup Rust (módulo nativo de captura)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build módulo nativo (native/gustashare-capture)
        run: npm run build-native

      - name: Build app (Windows real, sem wine)
        run: npm run build

      - name: Copiar .exe pra update-server
        shell: bash
        run: cp release/GustaShare-Portable.exe update-server/GustaShare-Portable.exe

      - name: Atualizar latest.json
        run: node scripts/sync-update-server.js

      - name: Deploy update-server na Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Root Directory no painel é `update-server`. A CLI junta isso
        # no CWD — tem que ser a raiz do repo, senão vira
        # update-server/update-server. O project.json da pasta linka o
        # projeto; copiamos pra `.vercel/` da raiz só nesta step (está
        # no .gitignore). A CLI então manda só o Root Directory, e o
        # `.vercelignore` de lá deixa o .exe entrar.
        run: |
          mkdir -p .vercel
          cp update-server/.vercel/project.json .vercel/project.json
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Commitar versão + latest.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json update-server/latest.json
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          git push
