name: Build and release GustaShare

# So dispara manualmente (aba Actions -> Run workflow). A versao so muda
# quando esse workflow roda de verdade — "npm run publish" so envia
# codigo, nao mexe em versao nem builda nada.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        run: npm run bump-version

      - name: Read version
        id: version
        shell: pwsh
        run: echo "version=$(node -p "require('./package.json').version")" >> $env:GITHUB_OUTPUT

      - name: Setup Rust (módulo nativo de captura)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build módulo nativo (native/gustashare-capture)
        run: npm run build-native

      - name: Build app (Windows real, sem wine)
        run: npm run build

      - name: Atualizar latest.json
        run: node scripts/sync-update-server.js

      - name: Build web (base absoluta, pra Vercel)
        run: npm run build:web

      - name: Publicar .exe no GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GustaShare v${{ steps.version.outputs.version }}
          files: release/GustaShare-Portable.exe
          fail_on_unmatched_files: true
          make_latest: true

      - name: Deploy na Vercel
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Root Directory do painel tem que estar VAZIO (raiz do repo).
        # Publicamos só o `dist/` (app web + latest.json) num staging.
        # O .exe fica no GitHub Release; /GustaShare-Portable.exe redireciona.
        run: |
          ls -lh dist/latest.json
          staging="$(mktemp -d)"
          mkdir -p "$staging/.vercel"
          cp update-server/.vercel/project.json "$staging/.vercel/project.json"
          cp scripts/vercel-static.json "$staging/vercel.json"
          cp -r dist/. "$staging/"
          cd "$staging"
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Commitar versão + latest.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json update-server/latest.json
          git diff --cached --quiet || git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci] [skip vercel]"
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5; do
            git fetch origin "$branch"
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push rejeitado, tentando de novo ($i)..."
            sleep 4
          done
          echo "Não conseguiu enviar o commit de versão."
          exit 1
